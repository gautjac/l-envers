name: LEnvers
options:
  bundleIdPrefix: app.atelier
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: fr

# FR-first (Québécois). fr is the development/fallback language.
knownRegions:
  - fr
  - en
  - Base

settings:
  base:
    # Swift 5 language mode: the toolchain still builds the SwiftData / Observation
    # APIs we use, but without strict concurrency we avoid actor-isolation churn in
    # a small app. (Matches the rest of the Atelier native stack.)
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Jac's personal Apple ID team — a stable identifier keeps the code signature steady.
    DEVELOPMENT_TEAM: 9WZ66DZ69J
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  LEnvers:
    type: application
    # macOS-only windowed app (WindowGroup) + a MenuBarExtra for quick summon.
    supportedDestinations: [macOS]
    deploymentTarget:
      macOS: "14.0"
    sources:
      - path: Sources
    info:
      path: Sources/Resources/Info.plist
      properties:
        CFBundleDisplayName: L'Envers
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSHumanReadableCopyright: "© 2026 Jacques Gautreau"
        CFBundleDevelopmentRegion: fr
        CFBundleLocalizations:
          - fr
          - en
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.atelier.l-envers
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        # The App Sandbox is ON. L'Envers calls Anthropic directly with the
        # user's own key, so it needs the outgoing-network client entitlement
        # plus Keychain access — both declared in LEnvers.entitlements.
        CODE_SIGN_ENTITLEMENTS: Sources/Resources/LEnvers.entitlements

  LEnversTests:
    type: bundle.unit-test
    supportedDestinations: [macOS]
    deploymentTarget:
      macOS: "14.0"
    sources:
      - path: Tests
    dependencies:
      - target: LEnvers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.atelier.l-envers.tests
        GENERATE_INFOPLIST_FILE: YES
        "TEST_HOST[sdk=macosx*]": "$(BUILT_PRODUCTS_DIR)/LEnvers.app/Contents/MacOS/LEnvers"

schemes:
  LEnvers:
    build:
      targets:
        LEnvers: all
        LEnversTests: [test]
    test:
      targets:
        - LEnversTests
